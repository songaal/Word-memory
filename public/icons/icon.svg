<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde9a8"/><stop offset="1" stop-color="#f6cd6e"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cf9a68"/><stop offset="1" stop-color="#bb8452"/>
    </linearGradient>
    <radialGradient id="orange" cx=".38" cy=".35" r=".7">
      <stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff7a00"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- ears at the top corners of the head -->
  <ellipse cx="88" cy="196" rx="40" ry="32" fill="#8a5631"/><ellipse cx="90" cy="200" rx="21" ry="16" fill="#5e3618"/>
  <ellipse cx="424" cy="196" rx="40" ry="32" fill="#8a5631"/><ellipse cx="422" cy="200" rx="21" ry="16" fill="#5e3618"/>
  <!-- the face fills the icon -->
  <path d="M-10 540 L-10 290 C-10 196 90 160 256 160 C422 160 522 196 522 290 L522 540 Z" fill="url(#fur)"/>
  <!-- darker snout -->
  <rect x="166" y="286" width="180" height="250" rx="80" fill="#a8703f"/>
  <!-- sleepy eyes, wide apart -->
  <ellipse cx="140" cy="279" rx="19" ry="12" fill="#2b1a10"/>
  <ellipse cx="372" cy="279" rx="19" ry="12" fill="#2b1a10"/>
  <rect x="114" y="252" width="52" height="22" fill="#cb9563"/>
  <rect x="346" y="252" width="52" height="22" fill="#cb9563"/>
  <path d="M118 274 L162 274 M350 274 L394 274" fill="none" stroke="#6b3f1f" stroke-width="6" stroke-linecap="round"/>
  <!-- blush -->
  <ellipse cx="104" cy="336" rx="30" ry="16" fill="#ff9fb0" opacity=".35"/>
  <ellipse cx="408" cy="336" rx="30" ry="16" fill="#ff9fb0" opacity=".35"/>
  <!-- wide nose with slit nostrils -->
  <rect x="198" y="300" width="116" height="46" rx="23" fill="#3d2414"/>
  <ellipse cx="228" cy="323" rx="11" ry="5.5" fill="#1f0f06" transform="rotate(-18 228 323)"/>
  <ellipse cx="284" cy="323" rx="11" ry="5.5" fill="#1f0f06" transform="rotate(18 284 323)"/>
  <ellipse cx="232" cy="310" rx="16" ry="4.5" fill="#fff" opacity=".15"/>
  <!-- calm smile -->
  <path d="M256 346 L256 420 M226 436 Q240 424 256 421 Q272 424 286 436" fill="none" stroke="#3d2414" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- a mandarin orange on top -->
  <ellipse cx="256" cy="166" rx="46" ry="10" fill="#000" opacity=".12"/>
  <circle cx="256" cy="118" r="50" fill="url(#orange)" stroke="#e86f00" stroke-width="3"/>
  <circle cx="240" cy="100" r="12" fill="#fff" opacity=".35"/>
  <circle cx="276" cy="130" r="2.5" fill="#e07800" opacity=".6"/><circle cx="262" cy="142" r="2.5" fill="#e07800" opacity=".6"/><circle cx="286" cy="112" r="2.5" fill="#e07800" opacity=".6"/>
  <path d="M256 70 L258 82" stroke="#6b4a1f" stroke-width="6" stroke-linecap="round"/>
  <path d="M258 74 C272 52 300 50 312 60 C296 78 274 82 258 74 Z" fill="#3fae49"/>
  <path d="M262 73 C278 66 292 62 306 61" stroke="#2c8a36" stroke-width="2.5" fill="none" stroke-linecap="round"/>
